[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cutflow"
version = "0.1.0"
description = "Système de montage vidéo programmatif et agentique — DSL déclaratif, rendu FFmpeg, export NLE, tools LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "CutFlow Team" }]
keywords = ["video", "ffmpeg", "editing", "otio", "llm-tools", "whisper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
  "ffmpeg-python>=0.2",
  "pymediainfo>=6.0",
  "opentimelineio>=0.17",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.3",
  "mypy>=1.9",
]
all = [
  "faster-whisper>=1.0",
  "scenedetect[opencv]>=0.6",
  "pymediainfo>=6.0",
  "opentimelineio>=0.17",
]

[project.urls]
Homepage = "https://github.com/cutflow/cutflow"
Repository = "https://github.com/cutflow/cutflow"
Issues = "https://github.com/cutflow/cutflow/issues"

[project.scripts]
cutflow = "cutflow.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cutflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["cutflow"]
branch = true
